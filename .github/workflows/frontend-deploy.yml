name: Deploy Frontend to S3

on:
    push:
        branches:
            - main
        paths:
            - 'frontend/**'
concurrency:
    group: frontend-deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install Dependencies
              run: npm ci

            - name: Build React App
              working-directory: frontend
              run: npm run build
              env:
                  VITE_API_URL: ${{secrets.VITE_API_URL}}
                  VITE_S3_BASE_URL: ${{secrets.VITE_S3_BASE_URL}}
                  VITE_RAZORPAY_KEY_ID: ${{secrets.VITE_RAZORPAY_KEY_ID}}
                  VITE_CONDITIONS_API_URL: ${{secrets.VITE_CONDITIONS_API_URL}}
                  VITE_MEDICINE_API_URL: ${{secrets.VITE_MEDICINE_API_URL}}
                  VITE_LIVEKIT_URL: ${{secrets.VITE_LIVEKIT_URL}}

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Upload to S3
              run: |
                  aws s3 sync dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

            - name: Invalidate CloudFront Cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
                    --paths "/*"
